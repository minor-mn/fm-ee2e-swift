# v から始まるタグ（v1.0.0 など）を push すると、.app を作って zip にし、そのタグの Release に添付する。
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    # Apple Silicon の macOS 27 と Xcode 27（Swift 6.4）。
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5

      - name: Build app
        run: sh scripts/make-app.sh

      # 署名なしでも、バンドル全体をアドホック署名しておくと「壊れている」と出にくい。
      - name: Sign ad-hoc
        run: codesign --force --deep -s - .build/fm-ee2e.app

      # アプリと、~/.config にコピーする fm-ee2e フォルダーを1つのフォルダーにまとめる。
      - name: Zip app
        run: |
          dir="fm-ee2e-swift-${GITHUB_REF_NAME}"
          mkdir "$dir"
          cp -R .build/fm-ee2e.app fm-ee2e "$dir/"
          ditto -c -k --keepParent "$dir" "$dir.zip"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "fm-ee2e-swift-${GITHUB_REF_NAME}.zip" --title "$GITHUB_REF_NAME" --generate-notes
