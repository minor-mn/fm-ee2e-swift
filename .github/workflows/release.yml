# GitHub の Releases でタグを選んで Release を公開すると、そのタグが指すコミットから .app を作って zip にし、その Release に添付する。
# タグを push しただけでは何もしない。
name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    # Apple Silicon の macOS 27 と Xcode 27（Swift 6.4）。
    runs-on: xcode-27
    steps:
      # Release のタグが指すコミットを取り出す。
      # make-app.sh が git describe でバージョンを決めるので、タグを含めて全部取る。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build app
        run: sh scripts/make-app.sh

      # Dr.Nitrovic の自己署名証明書でバンドル全体に署名する。
      # Secrets の SIGNING_CERT_P12（.p12 を base64 にしたもの）を一時キーチェーンに読み込み、そのキーチェーンだけから証明書を探す。
      - name: Sign with Dr.Nitrovic
        env:
          P12_BASE64: ${{ secrets.SIGNING_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pass=$(openssl rand -base64 24)
          printf %s "$P12_BASE64" | base64 -d > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          security import "$RUNNER_TEMP/signing.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$kc" >/dev/null
          rm "$RUNNER_TEMP/signing.p12"
          codesign --force --deep --keychain "$kc" -s "Dr.Nitrovic" .build/fm-ee2e.app
          codesign -dvv .build/fm-ee2e.app

      # 失敗したときも一時キーチェーンを消す。
      - name: Delete signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      # アプリと、~/.config にコピーする fm-ee2e フォルダーと、それらを置く install.sh を1つのフォルダーにまとめる。
      # install.sh が releases/latest/download/fm-ee2e-swift.zip から取れるよう、名前にバージョンを入れない。
      - name: Zip app
        run: |
          mkdir fm-ee2e-swift
          cp -R .build/fm-ee2e.app fm-ee2e scripts/install.sh fm-ee2e-swift/
          ditto -c -k --keepParent fm-ee2e-swift fm-ee2e-swift.zip

      # 公開した Release に添付する（同じ名前のファイルがあれば置き換える）。
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" fm-ee2e-swift.zip --clobber
